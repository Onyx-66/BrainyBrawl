# Set environment variables or untracked user Gradle properties; do not add secrets here.
SUPABASE_URL=https://YOUR_PROJECT.supabase.co
SUPABASE_PUBLISHABLE_KEY=sb_publishable_REPLACE_WITH_PUBLIC_CLIENT_KEY
# Service-role/secret keys are prohibited in the Android build.
# Owner-approved legal pages (HTTPS), required by release readiness checks.
PRIVACY_POLICY_URL=
TERMS_URL=
# Public web account-deletion request page for Play Console (not a secret).
ACCOUNT_DELETION_URL=
# Signing is supplied via environment only: BRAWL_KEYSTORE_PATH,
# BRAWL_KEYSTORE_PASSWORD, BRAWL_KEY_ALIAS, BRAWL_KEY_PASSWORD.
# Never place real signing passwords or keystores in this file/repository.

# Enable only after configuring and testing the corresponding Supabase provider.
GOOGLE_AUTH_ENABLED=false
DISCORD_AUTH_ENABLED=false
