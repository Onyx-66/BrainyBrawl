project_id = "brainybrawl-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "brainybrawl://auth/callback"
additional_redirect_urls = ["brainybrawl://auth/callback", "brainybrawl://auth/callback?flow=recovery"]
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.game-action]
verify_jwt = true
